name = "deltascreener-twitter-agent"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Cron triggers (all times in UTC)
# Slot 1: 8:30am ET  = 12:30 UTC (EST) / 13:30 UTC (EDT, summer)
# Slot 2: 10:30am ET = 14:30 UTC (EST) / 15:30 UTC (EDT)
# Slot 3: 12:30pm ET = 16:30 UTC (EST) / 17:30 UTC (EDT)
# Slot 4: 3:00pm ET  = 19:00 UTC (EST) / 20:00 UTC (EDT)
# Slot 5: 5:00pm ET  = 21:00 UTC (EST) / 22:00 UTC (EDT)
# Using EDT (summer) times — adjust in November for EST
[triggers]
crons = [
  "30 13 * * 1-5",
  "30 15 * * 1-5",
  "30 17 * * 1-5",
  "0 20 * * 1-5",
  "0 22 * * 1-5"
]

# Secrets (set via: wrangler secret put SECRET_NAME)
# Required secrets:
#   TWITTER_API_KEY
#   TWITTER_API_SECRET
#   TWITTER_ACCESS_TOKEN
#   TWITTER_ACCESS_TOKEN_SECRET
#   ANTHROPIC_API_KEY
#   FMP_API_KEY
