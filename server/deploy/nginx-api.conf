# DeltaScreener API — Nginx reverse proxy
#
# Install:
#   sudo cp nginx-api.conf /etc/nginx/sites-available/deltascreener-api
#   sudo ln -s /etc/nginx/sites-available/deltascreener-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate (certbot rewrites this file to add the TLS block):
#   sudo certbot --nginx -d api-vps.deltascreener.com
#
# NOTE: point api-vps.deltascreener.com at this server in Cloudflare DNS with
# the proxy (orange cloud) ON — that keeps DDoS protection and CDN in front of
# the box even though compute has moved off Cloudflare.

# Rate limit: the screener endpoint is the expensive one. 20 r/s per IP with a
# burst of 40 is generous for a human, restrictive for a scraper.
limit_req_zone $binary_remote_addr zone=ds_api:10m rate=20r/s;

upstream deltascreener_api {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-vps.deltascreener.com;

    # certbot replaces this with a 301 to https after issuing the cert
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-vps.deltascreener.com;

    # ── TLS (paths written by certbot) ──────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api-vps.deltascreener.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-vps.deltascreener.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # CORS is handled by the worker itself (corsHeaders()) — do not duplicate
    # it here or browsers will reject the doubled Access-Control-Allow-Origin.

    client_max_body_size 5m;
    client_body_timeout  30s;

    # Cloudflare sits in front; log the real client IP, not CF's edge.
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/ds-api.access.log;
    error_log  /var/log/nginx/ds-api.error.log warn;

    location / {
        limit_req zone=ds_api burst=40 nodelay;

        proxy_pass http://deltascreener_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # The deep-refresh admin endpoints legitimately run long.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    # Local health probe — not proxied, so it answers even if Node is down.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
